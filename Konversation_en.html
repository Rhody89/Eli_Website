<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation – Eleonora Rachor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans">
<div id="nav-placeholder"></div>
<script>
  fetch('nav.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('nav-placeholder').innerHTML = html;
      var s = document.createElement('script');
      s.src = 'nav-lang.js';
      s.onload = function() { if (window.setupNavLang) window.setupNavLang(); };
      document.body.appendChild(s);
    });
</script>
<div class="max-w-4xl mx-auto px-6 py-20">
  <h1 class="text-4xl font-bold mt-6 mb-6">Conversation</h1>
  <p class="mb-6">
    In my conversation courses, we practice free speaking in a relaxed atmosphere.
  </p>
  <ul class="list-disc pl-6 mb-6">
    <li>Everyday topics</li>
    <li>Improvement of pronunciation</li>
    <li>Speaking practice for all levels</li>
  </ul>
  <p>
    The goal is to gain more confidence and enjoyment in speaking.
  </p>
</div>
</body>
</html>

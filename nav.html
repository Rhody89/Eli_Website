  <script>
  // Mobile nav toggle logic: always open navMenu above menuToggle
  document.addEventListener('DOMContentLoaded', function() {
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');
    const angeboteDropdownBtn = document.getElementById('angeboteDropdownBtn');
    const angeboteDropdown = document.getElementById('angeboteDropdown');
    let dropdownOpen = false;
    if (menuToggle && navMenu) {
      menuToggle.addEventListener('click', function() {
        if (navMenu.classList.contains('hidden')) {
          navMenu.classList.remove('hidden');
          const btnRect = menuToggle.getBoundingClientRect();
          const scrollY = window.scrollY || window.pageYOffset;
          navMenu.style.top = (btnRect.top + scrollY - navMenu.offsetHeight) + 'px';
          navMenu.style.right = (window.innerWidth - btnRect.right) + 'px';
        } else {
          navMenu.classList.add('hidden');
        }
      });
      document.addEventListener('click', function(e) {
        if (!navMenu.contains(e.target) && !menuToggle.contains(e.target)) {
          navMenu.classList.add('hidden');
          if (angeboteDropdown) angeboteDropdown.classList.add('hidden');
        }
      });
      window.addEventListener('resize', function() {
        navMenu.classList.add('hidden');
        if (angeboteDropdown) angeboteDropdown.classList.add('hidden');
      });
    }
    // Dropdown logic for Angebote
    if (angeboteDropdownBtn && angeboteDropdown) {
      // Desktop: show on hover (handled by group-hover), Mobile: show on click
      angeboteDropdownBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        angeboteDropdown.classList.toggle('hidden');
        dropdownOpen = !dropdownOpen;
      });
      // Hide dropdown on click outside
      document.addEventListener('click', function(e) {
        if (dropdownOpen && !angeboteDropdownBtn.contains(e.target) && !angeboteDropdown.contains(e.target)) {
          angeboteDropdown.classList.add('hidden');
          dropdownOpen = false;
        }
      });
      // Hide dropdown on resize
      window.addEventListener('resize', function() {
        angeboteDropdown.classList.add('hidden');
        dropdownOpen = false;
      });
    }
  });
  </script>

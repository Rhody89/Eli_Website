<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{pageTitle}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background:#f7f5f3; }
    .heading { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="text-gray-900">

<div id="nav-placeholder"></div>

{{bodyHtml}}

<footer class="text-center py-10 text-sm text-gray-500">
  <a href="{{legalHrefSub}}#Impressum">{{legalLabel}} | </a>
  <a href="{{legalHrefSub}}#Datenschutz">{{privacyLabel}}</a>
  <br/>
  <p>© 2026 Eleonora Rachor</p>
</footer>

<div id="loginModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-2xl p-8 w-full max-w-xs relative">
    <button id="closeLogin" class="absolute top-2 right-2">&times;</button>
    <h2 class="heading text-xl mb-4">Login</h2>
    <form id="loginForm" class="grid gap-4">
      <input type="text" id="loginUser" placeholder="{{loginUser}}" class="border p-2 rounded">
      <input type="password" id="loginPass" placeholder="{{loginPass}}" class="border p-2 rounded">
      <button class="bg-black text-white py-2 rounded">{{loginButton}}</button>
      <div id="loginMsg" class="text-sm hidden"></div>
    </form>
  </div>
</div>

<script>
fetch('{{navFetchSub}}')
  .then(response => response.text())
  .then(html => {
    const navPlaceholder = document.getElementById('nav-placeholder');
    navPlaceholder.innerHTML = html;

    // Run scripts embedded in fetched nav markup so dynamic link rewriting is applied.
    navPlaceholder.querySelectorAll('script').forEach(oldScript => {
      const script = document.createElement('script');
      if (oldScript.src) {
        script.src = oldScript.src;
      } else {
        script.textContent = oldScript.textContent;
      }
      document.body.appendChild(script);
      oldScript.remove();
    });

    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');
    const loginBtn = document.getElementById('loginBtn');

    if (loginBtn) {
      loginBtn.onclick = () => loginModal.classList.remove('hidden');
    }

    if (menuToggle && navMenu) {
      menuToggle.onclick = (e) => {
        e.stopPropagation();
        navMenu.classList.toggle('hidden');
      };
      document.addEventListener('click', function(event) {
        if (!navMenu.classList.contains('hidden')) {
          const isClickInsideMenu = navMenu.contains(event.target);
          const isClickOnToggle = menuToggle.contains(event.target);
          if (!isClickInsideMenu && !isClickOnToggle) {
            navMenu.classList.add('hidden');
          }
        }
      });
      document.querySelectorAll('#navMenu a').forEach(link => {
        link.addEventListener('click', () => {
          if (window.getComputedStyle(menuToggle).display !== 'none') {
            navMenu.classList.add('hidden');
          }
        });
      });
    }
  })
  .catch(() => {
    document.getElementById('nav-placeholder').innerHTML = '{{navError}}';
  });

const loginModal = document.getElementById('loginModal');
const closeLogin = document.getElementById('closeLogin');
const loginForm = document.getElementById('loginForm');
const loginMsg = document.getElementById('loginMsg');

closeLogin.onclick = () => loginModal.classList.add('hidden');

loginForm.onsubmit = e => {
  e.preventDefault();
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  if (user === 'admin' && pass === 'demo') {
    loginMsg.textContent = '{{loginSuccess}}';
    loginMsg.classList.remove('hidden');
    loginMsg.classList.add('text-green-600');
    setTimeout(() => loginModal.classList.add('hidden'), 1000);
  } else {
    loginMsg.textContent = '{{loginFailure}}';
    loginMsg.classList.remove('hidden');
    loginMsg.classList.add('text-red-500');
  }
};
</script>
<script src="{{loginScriptSub}}"></script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events – Eleonora Rachor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background:#f7f5f3; }
    .heading { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="text-gray-900">
<!-- NAV -->
<div id="nav-placeholder"></div>
<script>
  fetch('nav.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('nav-placeholder').innerHTML = html;
      var s = document.createElement('script');
      s.src = 'nav-lang.js';
      s.onload = function() { if (window.setupNavLang) window.setupNavLang(); };
      document.body.appendChild(s);
    });
</script>
<!-- EVENTS SECTION -->
<section class="max-w-6xl mx-auto px-10 py-20">
  <h1 class="heading text-4xl mb-8">Events & Workshops</h1>
  <div class="grid md:grid-cols-2 gap-8">
    <div class="bg-white rounded-2xl p-8 shadow">
      <img src="images/flyer/Sprachcaf%C3%A9_v2.png" />
    </div>
  </div>
</section>
<footer class="text-center py-10 text-sm text-gray-500">
  © 2026 Eleonora Rachor
</footer>
</body>
</html>
